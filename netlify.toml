[build]
  command = "npm run build"
  publish = "."

[build.environment]
  # Firebase web config values are intentionally embedded in client code.
  # Keep actual server-only secrets out of client bundles.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_APP_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET"
